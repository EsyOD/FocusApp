[package]
name = "focus-app"
version = "0.1.0"
description = "A Pomodoro timer that helps you focus on one thing at a time"
edition = "2021"

[lib]
name = "focus_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"
